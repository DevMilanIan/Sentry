name: options-sentinel
services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: sentinel
      POSTGRES_USER: sentinel
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set a unique local database password in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sentinel -d sentinel"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [internal]

  trading-app:
    build:
      context: .
      target: runtime
    restart: unless-stopped
    init: true
    depends_on:
      postgres:
        condition: service_healthy
    env_file: [.env]
    environment:
      SENTRY_DATABASE_URL: postgresql+asyncpg://sentinel:${POSTGRES_PASSWORD:?Set a unique local database password in .env}@postgres:5432/sentinel
    volumes:
      - ./config:/app/config:ro
      - ./var:/app/var
    ports:
      - "127.0.0.1:8000:8000"
    networks: [internal]

  verify:
    profiles: [verification]
    build:
      context: .
      target: verification
    init: true
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SENTRY_TEST_DATABASE_URL: postgresql+asyncpg://sentinel:${POSTGRES_PASSWORD:?Set a unique local database password in .env}@postgres:5432/sentinel
      SENTRY_TEST_ALLOW_DATABASE_CREATION: "1"
    networks: [internal]

networks:
  internal:
    internal: false

volumes:
  postgres_data:
